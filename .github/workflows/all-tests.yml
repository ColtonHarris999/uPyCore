name: All Tests

on:
  pull_request:
    branches:
      - main
    # `edited` is not in the default type set, so retargeting a stacked PR onto
    # main did not start a run and the required `all-tests` check could never
    # appear.
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A title or body edit must not cancel the run a push just started.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref.from) }}

jobs:
  # Host checks. No Verilator. The uPy2 byte compare lives here too.
  host-tools:
    name: host-tools
    # Title and body edits share the head SHA with the run already in
    # progress. Skip them. Retargets fall through.
    if: github.event.action != 'edited' || github.event.changes.base.ref.from
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Unit tests and uPy2 byte compare
        run: make docker-test-host

  # RTL unit benches: each peripheral block on its own bus against the host model.
  benches:
    name: benches
    if: github.event.action != 'edited' || github.event.changes.base.ref.from
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Peripheral benches
        run: make docker-test-benches

  # Hardware tests, one job per area of upycore/programs/hw_tests.toml.
  # Each job verilates once, then runs the area from mpy-cross and from uPy2.
  # The compiler area calls compile/exec/eval on the hart, so that job is
  # allowed a longer timeout. `make test-compiler` is the host uPy2 suite.
  hardware:
    name: ${{ matrix.area }}
    if: github.event.action != 'edited' || github.event.changes.base.ref.from
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.area == 'compiler' && 360 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        area:
          - smoke
          - alu
          - control
          - calls
          - containers
          - strings
          - exceptions
          - objects
          - builtins
          - modules
          - integ
          - variables
          - memory
          - gc
          - generators
          - io
          - compiler
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run ${{ matrix.area }}
        run: make docker-test-hw-${{ matrix.area }}

  # Keep this job id/name so existing branch protection on "all-tests" still
  # matches. It is a gate over the area jobs, not one suite run.
  all-tests:
    name: all-tests
    needs: [host-tools, benches, hardware]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job that ran
        if: github.event.action != 'edited' || github.event.changes.base.ref.from
        run: |
          set -euo pipefail
          RESULTS='${{ toJSON(needs) }}'
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"result": *"(failure|cancelled|timed_out)"'; then
            echo "::error::one or more required jobs did not pass"
            exit 1
          fi
          test "${{ needs.host-tools.result }}" = "success"
          test "${{ needs.benches.result }}" = "success"
          test "${{ needs.hardware.result }}" = "success"
