# Hardware tests. Each entry is one MicroPython program.
#
#   make test                 build the simulator and run every test
#   make test-hw              the same suite without the host unit tests
#   make regen-goldens       rewrite the .stdout/.stderr/.exit files from the oracle
#   python3 upycore/tools/hw_tests.py --list
#   python3 upycore/tools/hw_tests.py --area alu
#
# The host compiles the program with mpy-cross, links it with the firmware,
# and boots that image. The golden files are the unix oracle's stdout,
# stderr, and exit status. `modules` names frozen modules linked into the
# image (name=path, path relative to upycore/programs).
#
# xfail is a known mismatch, in words. A failure is XFAIL. A pass is XPASS
# and fails the suite, so the marker comes off with the fix.
# uncaught: the oracle prints the traceback on stdout; the golden stores
# it as stderr, which is where the device prints it.
# disabled: kept, not booted. Compiler programs wait on the on-device
# compiler. Goldens still come from the unix oracle.
# oracle = false: the unix port cannot import a filesystem module, so the
# golden is the frozen-module result and regen leaves it alone.
# mpyc = false: mpy-cross still boots the program. The uPy2 compiler
# skips it. Generator programs set this because mpyc rejects yield.

[smoke]
hello = { file = "hw/smoke/hello.py" }
raise_err = { file = "hw/smoke/raise_err.py", uncaught = true }
